<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Shaxboz Azizxonov — Digital Card</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(430px,100%);border:1px solid #2a2a2a;border-radius:28px;background:linear-gradient(145deg,#181818,#0f0f0f);padding:30px;box-shadow:0 25px 70px rgba(0,0,0,.45)}
.mark{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8f8f8f;margin-bottom:70px}
.name{font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.04em;margin:0 0 10px}
.title{font-size:17px;color:#a9a9a9;margin-bottom:42px}
.actions{display:grid;gap:10px}
a,button{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:15px;text-decoration:none;font-size:16px;font-weight:600}
.primary{background:#fff;color:#111}
.secondary{border:1px solid #333;color:#fff;background:#171717}
.info{margin-top:28px;padding-top:20px;border-top:1px solid #292929;display:grid;gap:10px;color:#aaa;font-size:14px}
.info span{color:#fff}
.footer{margin-top:22px;color:#666;font-size:11px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<main class="card">
<div class="mark">Digital Business Card</div>
<h1 class="name">Shaxboz Azizxonov</h1>
<div class="title">Product Manager Beepul</div>
<div class="actions">
<a class="primary" href="tel:+998909366616">Call</a>
<a class="secondary" href="https://t.me/SAzizxonov">Telegram</a>
<a class="secondary" href="mailto:ShLCAzizkhonov@beelab.uz">Email</a>
<a class="secondary" href="Shaxboz_Azizxonov.vcf" download>Save Contact</a>
</div>
<div class="info">
<div>Phone <span>+998909366616</span></div>
<div>Telegram <span>@SAzizxonov</span></div>
<div>Email <span>ShLCAzizkhonov@beelab.uz</span></div>
</div>
<div class="footer">Tap • Connect • Save</div>
</main>
</div>
</body>
</html>
